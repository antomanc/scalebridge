[project]
name = "scalebridge"
version = "0.1.0"
description = "Listen to Bluetooth bathroom scales and forward weigh-ins to Garmin Connect and other sinks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Mancini" }]
requires-python = ">=3.12"
keywords = ["bluetooth", "ble", "scale", "xiaomi", "garmin", "weight"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "apprise>=2.0",
    "bleak>=3.0",
    "garminconnect>=0.3.19",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.scripts]
scalebridge = "scalebridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
